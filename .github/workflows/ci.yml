name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build, Test and Scan
    runs-on: truenas-website
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up authenticated remote BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Test Backend, Verify Linked Runtime and Scan Vulnerabilities
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: security-scan
          platforms: linux/amd64
          push: false
          cache-from: type=gha,version=2,scope=truenas-15ed4a3293d99fba
          cache-to: type=gha,version=2,mode=max,scope=truenas-15ed4a3293d99fba
          no-cache-filters: smoke-test,security-scan
