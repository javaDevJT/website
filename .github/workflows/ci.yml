name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: truenas-website
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Backend Tests
        run: ./mvnw --batch-mode test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-test-results
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: truenas-website
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-build
          path: target/generated-resources/static/
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: truenas-website
    needs: [backend-test, frontend-build]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up authenticated remote BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Build and Smoke Test Runtime Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: smoke-test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,version=2,scope=truenas-15ed4a3293d99fba
          cache-to: type=gha,version=2,mode=max,scope=truenas-15ed4a3293d99fba
          no-cache-filters: smoke-test
