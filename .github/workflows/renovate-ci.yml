name: Renovate verification
on:
  push:
    branches: [chore/renovate-private-runner]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: renovate-verify-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Renovate dependency CI
    if: >-
      github.repository == 'javaDevJT/website' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.id == github.event.repository.id) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/chore/renovate-private-runner'))
    runs-on: truenas-website-storage-16g
    timeout-minutes: 40
    steps:
      - name: Select the dependency verification scope
        id: scope
        env:
          IS_DEPENDENCY_UPDATE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 29139614 && startsWith(github.head_ref, 'renovate/') && github.head_ref != 'renovate/configure' }}
          IS_ONBOARDING: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'renovate/configure' || github.head_ref == 'chore/renovate-onboarding') }}
        run: |
          echo "deps=$IS_DEPENDENCY_UPDATE" >> "$GITHUB_OUTPUT"
          echo "setup=$IS_ONBOARDING" >> "$GITHUB_OUTPUT"
          if [[ "$IS_DEPENDENCY_UPDATE" == false && "$IS_ONBOARDING" == false ]]; then
            echo "This pull request uses the repository's normal CI."
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.scope.outputs.deps == 'true' || steps.scope.outputs.setup == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.setup == 'true'
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Validate the Renovate configuration
        if: steps.scope.outputs.setup == 'true'
        run: npx --yes --package renovate@45.1.2 -- renovate-config-validator --strict
      - name: Set up authenticated remote BuildKit
        if: steps.scope.outputs.deps == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Test backend and build frontend in Website's test stage
        if: steps.scope.outputs.deps == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          target: backend-check
          build-args: |
            QB_SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          platforms: linux/amd64
          no-cache-filters: backend-check
          outputs: type=cacheonly
          push: false
